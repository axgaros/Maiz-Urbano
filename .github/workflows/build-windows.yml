name: Windows - Compilacion y pruebas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar y ejecutar verificaciones (incluye --self-check del EXE)
        shell: pwsh
        run: ./build_windows.ps1
      - name: Confirmar ausencia de datos reales en distribucion
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path 'dist/MaizUrbano/data' -File -ErrorAction SilentlyContinue)
          if ($files.Count -gt 0) { throw 'La compilacion contiene datos: se cancela.' }
      - name: Publicar ejecutable portable para Windows
        uses: actions/upload-artifact@v4
        with:
          name: MaizUrbano-Windows-portable
          path: dist/MaizUrbano/
          if-no-files-found: error
          retention-days: 14
